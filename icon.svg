<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0a2d73"/>
      <stop offset="1" stop-color="#0277bd"/>
    </linearGradient>
    <radialGradient id="hl" cx="0.3" cy="0.22" r="0.65">
      <stop offset="0" stop-color="white" stop-opacity="0.13"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Glass highlight -->
  <rect width="512" height="512" rx="100" fill="url(#hl)"/>
  <!-- Wave 1 -->
  <path fill="rgba(1,87,155,0.68)" d="M0,370 C107,307 225,413 342,347 C413,307 470,347 512,332 L512,512 L0,512Z"/>
  <!-- Wave 2 -->
  <path fill="rgba(255,255,255,0.10)" d="M0,432 C91,392 192,456 294,418 C366,386 452,432 512,416 L512,512 L0,512Z"/>
  <!-- Fish body -->
  <ellipse cx="256" cy="218" rx="130" ry="52" fill="white" opacity="0.92"/>
  <!-- Fish tail -->
  <path fill="white" opacity="0.92" d="M130,195 L75,155 L75,282 L130,242Z"/>
  <!-- Fish eye -->
  <circle cx="350" cy="206" r="14" fill="#0d47a1"/>
  <circle cx="354" cy="202" r="5.5" fill="white"/>
  <!-- Lure -->
  <ellipse cx="108" cy="218" rx="18" ry="28" fill="#FFD740"/>
  <!-- Lure highlight -->
  <ellipse cx="103" cy="207" rx="6" ry="11" fill="rgba(255,255,255,0.58)"/>
  <!-- Hook -->
  <path stroke="#FFD740" stroke-width="7" fill="none" stroke-linecap="round" d="M95,250 A24,24 0 0 0 119,278"/>
  <!-- Fishing line (dashed) -->
  <path stroke="rgba(255,255,255,0.40)" stroke-width="5" fill="none" stroke-dasharray="13,9" d="M430,30 Q78,137 108,218"/>
  <!-- Rod tip -->
  <circle cx="430" cy="30" r="12" fill="#FFD740"/>
  <!-- Water bubbles -->
  <circle cx="330" cy="300" r="10" fill="none" stroke="rgba(255,255,255,0.32)" stroke-width="4"/>
  <circle cx="350" cy="285" r="7" fill="none" stroke="rgba(255,255,255,0.32)" stroke-width="4"/>
  <circle cx="315" cy="290" r="8" fill="none" stroke="rgba(255,255,255,0.32)" stroke-width="4"/>
</svg>
